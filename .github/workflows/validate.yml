name: Validate Unified Garment SaaS

on:
  push:
    branches: [feature/unified-garment-saas]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install server
        working-directory: server
        run: npm ci
      - name: Check server imports
        working-directory: server
        run: node --check src/app.js && node --check src/controllers/garmentFlowController.js && node --check src/models/GarmentFlow.js
      - name: Install client
        working-directory: client
        run: npm ci
      - name: Build client
        working-directory: client
        run: npm run build
